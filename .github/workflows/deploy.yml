name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/heylark/klgpff-bot
            git pull
            # --wait: the step succeeds only once the healthcheck (fresh /tmp/heartbeat) is healthy;
            # a crash-looping or unhealthy container fails the run (and sends the "deploy failed"
            # message) instead of ending green. start_period 40s + one 30s probe, so 90s is ample.
            docker compose up -d --build --wait --wait-timeout 90 klgpff-bot
            docker compose ps

      # Ops-group messages through the shared action dontkaiad/ops-notify (a public copy of
      # heylark-infra/ops; this repository is public, so it cannot use the private original). The topic
      # (klgpff) comes from that action's topics.env. The action never fails this job; a Telegram
      # problem shows up as a ::warning::.
      - name: Notify (deploy ok)
        uses: dontkaiad/ops-notify@v1
        with:
          project: klgpff
          kind: deploy_ok
          token: ${{ secrets.TG_LOG_BOT_TOKEN }}
          chat-id: ${{ secrets.TG_LOG_CHAT_ID }}

      - name: Notify (deploy failed)
        if: failure()
        uses: dontkaiad/ops-notify@v1
        with:
          project: klgpff
          kind: deploy_fail
          title: Deploy over SSH
          token: ${{ secrets.TG_LOG_BOT_TOKEN }}
          chat-id: ${{ secrets.TG_LOG_CHAT_ID }}
