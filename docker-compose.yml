services:
  klgpff-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # Postgres с pgvector живёт в контейнере nexus-arcana-db (своя база и роль
    # klgpff), поэтому бот подключён и к его сети. Недоступность БД не ломает
    # бота: RAG падает на полный список фактов.
    networks:
      - default
      - nexus_arcana
    volumes:
      - ./facts:/app/facts
      - ./prompts:/app/prompts
      - ./models:/app/models
      - ./backups:/app/backups
    # $$ — экранирование для Compose: в раннер уходит литеральный $, healthcheck
    # сравнивает свежесть /tmp/heartbeat (now - mtimestamp < 90с).
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/heartbeat) )) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Остаток прежнего хранилища векторов: бот в него больше не ходит. Оставлен на
  # время проверки pgvector ради отката, после проверки удалить сервис и том.
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

networks:
  nexus_arcana:
    external: true
    name: nexus-arcana_default

volumes:
  qdrant_storage:
