services:
  klgpff-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - qdrant
    volumes:
      - ./facts:/app/facts
      - ./prompts:/app/prompts
      - ./models:/app/models
      - ./outputs:/app/outputs
      - ./backups:/app/backups
    # $$ — экранирование для Compose: в раннер уходит литеральный $, healthcheck
    # сравнивает свежесть /tmp/heartbeat (now - mtimestamp < 90с).
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/heartbeat) )) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
